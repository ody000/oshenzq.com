<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title_tag}}</title>
<meta name="description" content="{{description}}">
{{robots}}
<link rel="canonical" href="{{canonical}}">
<link rel="preload" href="/assets/fonts/SourceSerif4-Regular-subset.woff2" as="font" type="font/woff2" crossorigin>
